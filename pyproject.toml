[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Virtual portfolio platform for fiat and crypto currencies with parser service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "python-dotenv>=1.2.4",
    "requests>=2.32.0",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.valutatrade]
data_dir = "data"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_format = "text"
log_level = "INFO"
log_file = "logs/actions.log"
